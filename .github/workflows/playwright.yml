name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run every Monday at 09:00 WIB (02:00 UTC)
  schedule:
    - cron: '0 2 * * 1'

# Fix the GitHub Actions deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Use the Playwright Docker image so we do not install browsers
    # Remember: the version tag must match the playwright version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Cache npm dependencies to make the run faster
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci
      
    # Check code formatting before running tests
    - name: Check Code Formatting
      run: npm run format -- --check
      
    - name: Run Lint Check
      run: npm run lint

    # Save the date so the report name can use it
    - name: Generate Timestamp
      id: timestamp
      run: echo "REPORT_DATE=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Run E2E Tests
      run: npm run test
      env:
        # Force CI mode to prevent terminal from hanging
        CI: true
        PRESET_PREMIUM_EMAIL: ${{ secrets.PRESET_PREMIUM_EMAIL }}
        PRESET_PREMIUM_PASSWORD: ${{ secrets.PRESET_PREMIUM_PASSWORD }}
        PRESET_NORMAL_EMAIL: ${{ secrets.PRESET_NORMAL_EMAIL }}
        PRESET_NORMAL_PASSWORD: ${{ secrets.PRESET_NORMAL_PASSWORD }}

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Report name uses the date from the previous step
        name: playwright-report-${{ steps.timestamp.outputs.REPORT_DATE }}
        path: playwright-report/
        retention-days: 7

    # Allure results are used by the build-report job below
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 7

    - name: Send Telegram Notification
      if: always()
      # Pinned to a release version so the action does not change unexpectedly
      uses: appleboy/telegram-action@v1.1.2
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        message: |
          🤖 *Hotel Planisphere Automation Run*
          
          *Status:* ${{ job.status }}
          *Branch:* ${{ github.ref_name }}
          
          🔍 *Report & Logs:*
          Click the link below to view the GitHub Actions run and download the generated report artifact (ZIP).
          
          🔗 [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # Build the Allure report from the test results
  build-report:
    needs: test
    # Build the report even when some tests fail, so the report still shows them
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download Allure Results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    # The Allure command line needs Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Allure Report
      run: |
        npm install --no-save allure-commandline
        npx allure generate allure-results --clean -o allure-report

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

  # Publish the Allure report to GitHub Pages (skip pull requests)
  deploy-report:
    needs: build-report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4